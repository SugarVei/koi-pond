<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>锦池 · 可以触摸的池塘</title>
<script>
  // Opt in before the first paint; the standalone page keeps its original UI.
  if (new URLSearchParams(location.search).get('embed') === '1') {
    document.documentElement.classList.add('is-embed');
  }
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #86cbbf; overflow: hidden; }
  .hero {
    position: relative; width: 100%; height: 100vh; height: 100dvh; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .pond {
    position: absolute; inset: 0;
    background: #86cbbf no-repeat; background-size: cover; background-position: var(--bg-pos, 22% 50%);
  }
  .hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
  .is-embed .hero:focus-visible { outline: 2px solid rgba(255,255,255,.85); outline-offset: -4px; }
</style>
</head>
<body>
<main class="hero" id="hero">
  <div class="pond" id="pond" aria-hidden="true"></div>
  <canvas id="water" aria-hidden="true"></canvas>
  <canvas id="surface" aria-hidden="true"></canvas>
</main>


<script>
/* ==========================================================================
   配置区 —— 常改的参数都在这里
   ========================================================================== */
const CONFIG = {
  // —— 锦鲤 ——
  fishCount: 6,             // 锦鲤数量（建议 5–7）
  fishCountNarrow: 4,       // 窄屏（< 700px）时的数量
  fishSize: 0.122,          // 体长占底图宽度的比例（按画面比例定尺寸，不再依赖底图里的鱼）
  fishMaxScreen: 0.42,      // 体长上限：不超过屏幕短边的这个比例（手机上避免鱼过大）
  fishDepth: [0.05, 0.95],  // 深度变化范围：0 = 贴近水面（大、清晰、实），1 = 贴近池底（小、淡、糊）
  depthChange: [6, 14],     // 每隔多少秒换一个目标深度
  depthSpeed: 0.22,         // 上浮 / 下沉的快慢
  fishSensitivity: 1.0,     // 鱼对指针的敏感度：越大越容易好奇靠近 / 受惊逃开
  wake: 1.0,                // 鱼加速窜动时尾后小涟漪的强度（慢游几乎无痕）
  // —— 水面 ——
  causticSpeed: 1.0,        // 水光（焦散）流动速度，0 = 静止
  causticStrength: 1.0,     // 水光亮度
  breathe: 1.0,             // 水面呼吸明暗幅度
  rippleStrength: 1.0,      // 涟漪强度（指针、点击、鱼激起的水花）
  rippleDecay: 0.985,       // 涟漪衰减，越接近 1 传得越远、留得越久（0.97–0.993）
  refraction: 1.0,          // 涟漪对水底的折射扭曲程度
  idleRipple: [2.5, 6],     // 无人操作时“无源涟漪”的随机间隔（秒）
  foodPerClick: 5,          // 每次投食的颗粒数
  // —— 水面上的荷叶 / 枫叶（被水波推动） ——
  padWavePush: 1.0,         // 推力：水波把叶子推走的力度
  padTilt: 1.0,             // 摇摆强度：随波倾斜（透视压缩、明暗、投影反向偏移）
  padSpin: 1.0,             // 旋转响应：波斜着扫过时被拧转的程度
  padBob: 1.0,              // 起伏强度：随波上下（缩放、投影远近）
  leafBoost: { push: 1.25, tilt: 1.5, spin: 2.4, bob: 1.3 },   // 枫叶更轻：在上面四项基础上再乘的放大系数
  // —— 垂钓者 ——
  restTime: [5, 10],        // 静止期时长（秒）：竿放低、浮漂收在竿边
  waitTime: [8, 20],        // 落水后等待时长（秒），之后收竿
  bites: [1, 2],            // 每次等待中“咬钩”徵兆的次数范围
  castReach: [480, 760],    // 抛竿落点离手的距离（底图像素）
  firstReel: [1, 1.8],      // 页面打开后第一次收竿的时间（秒）：开场浮漂已在水里，收回后歇 1 秒就第一次抛竿（约 5 秒内）
  // —— 画面 ——
  maxDpr: 2,                // devicePixelRatio 上限（性能保护）
  focus: {                  // 底图 cover 裁切焦点 [x, y]，0–1
    wide: [0.22, 0.5],      // 横屏：偏左，保住栈道和钓者
    tall: [0.38, 0.5]       // 竖屏：保住鱼线、浮漂和开阔水面
  },
  reducedMotionSpeed: 0.2   // prefers-reduced-motion 时的整体速度倍率（垂钓者也停止抛竿）
};

/* ==========================================================================
   底图里的固定坐标（原图像素，1847 × 852）
   ========================================================================== */
const IMG = {
  w: 1847, h: 852,
  patchAt: [330, 360],                  // 去掉钓竿 / 鱼线 / 浮漂 / 竿影后的补丁位置
  fig: { plate: [120, 300], hat: [133, 327], arms: [185, 316], hands: [305, 398] },   // 人物可动部件（补底 / 斗笠 / 袖子 / 双手）的位置
  hatC: [205, 402], hip: [224, 402], torsoH: 180,   // 斗笠中心、髋部支点、髋到头顶的高度（前后倾时斗笠的平移量由它算）
  shoulder: [214, 400], grip: [336, 425],           // 两肩中点、握竿点（袖子在这两点之间伸缩）
  pivot: [340, 424.2],                  // 握竿的手 = 钓竿支点
  rodS0: -61, rodTip: 417, rodEnd: 422, // 竿身贴图从握把尾端（支点后 61px）开始；竿梢距支点 417px
  rodAng: Math.atan2(413.98 - 424.21, 757 - 340),
  rodZ: 40,                             // 手离水面的高度（像素当量，用来算投影）
  hang: 26,                             // 收竿后鱼线的长度：浮漂吊在竿梢下
  bobber: [894, 424], bobR: 9.6,        // 开场浮漂位置
  sun: [-0.18, 0.85],                   // 光线：物体每升高 1px，投影偏移这么多（与底图竿影一致）
  floatShadow: [-85, 80],               // 水面漂浮物落在池底的投影偏移（量自底图原有荷叶 / 枫叶的影子）
  // 底图原有的枫叶 / 荷叶 / 荷花，已从底图移除，原位改为动态：[l 枫叶 | p 荷叶, 左, 上, 宽, 高, 半径, 贴图集 x, y, 初始转角]
  floats: [
    ['l', 240, 114, 65, 67, 22.2, 0, 0, 0],
    ['l', 1332, -9, 69, 63, 22.4, 67, 0, 0.06],
    ['l', 1659, 334, 69, 63, 22.4, 67, 0, 0],
    ['l', 1401, 799, 65, 67, 22.2, 0, 0, -2.07],
    ['p', 272, 52, 108, 95, 42.6, 138, 0, 0],
    ['p', 457, 66, 145, 129, 56.8, 248, 0, 0],
    ['p', 415, -44, 114, 115, 40.9, 395, 0, 0],
    ['p', 567, -44, 108, 128, 44.7, 511, 0, 0],
    ['p', 345, 663, 197, 233, 83.6, 0, 131, 0],
    ['p', 505, 794, 102, 102, 35.1, 199, 131, 0],
    ['p', 1600, 185, 99, 99, 43.2, 303, 131, 0],
    ['p', 1546, 652, 80, 79, 33.8, 404, 131, 0],
    ['p', 1605, 704, 86, 89, 38.4, 486, 131, 0]
  ],
  pondCenter: [1060, 430]
};

(() => {
'use strict';

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const wrapA = (a) => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const ease = (rate, dt) => 1 - Math.exp(-rate * dt);

const hero = document.getElementById('hero');
const embedded = document.documentElement.classList.contains('is-embed');
let keyboardPoint = null;
if (embedded) {
  hero.tabIndex = 0;
  hero.setAttribute('role', 'region');
  hero.setAttribute('aria-label', '互动锦池：方向键划水，空格或回车投食。Interactive koi pond: arrow keys stir the water; Space or Enter feeds the fish.');
  hero.setAttribute('aria-keyshortcuts', 'ArrowUp ArrowDown ArrowLeft ArrowRight Space Enter');
}
const pondEl = document.getElementById('pond');
const cvW = document.getElementById('water');
const cvS = document.getElementById('surface');
const sctx = cvS.getContext('2d');
const cvH = document.createElement('canvas'), hctx = cvH.getContext('2d');      // 浮叶 / 浮漂 / 钓竿的水底投影（低分辨率 = 天然模糊）
const SHADOW_DOWN = 5;

const motionMQ = matchMedia('(prefers-reduced-motion: reduce)');
let reduced = motionMQ.matches;
const RS = () => CONFIG.rippleStrength * (reduced ? 0.5 : 1);

/* ---------------- 视图映射：原图坐标 <-> 屏幕 CSS 像素 ---------------- */
const V = { W: 1, H: 1, s: 1, ox: 0, oy: 0, dpr: 1, gdpr: 1, fdpr: 1, home: [0, 0] };
function layout() {
  V.W = hero.clientWidth; V.H = hero.clientHeight;
  V.s = Math.max(V.W / IMG.w, V.H / IMG.h);
  const f = V.W / V.H < 0.9 ? CONFIG.focus.tall : CONFIG.focus.wide;
  V.ox = (V.W - IMG.w * V.s) * f[0];
  V.oy = (V.H - IMG.h * V.s) * f[1];
  hero.style.setProperty('--bg-pos', `${f[0] * 100}% ${f[1] * 100}%`);
  V.dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
  // 水面画布：超过底图本身的细节没有意义（只是放大像素），同时限制总像素量保 60fps
  V.gdpr = Math.min(V.dpr, Math.max(1, 1.5 / V.s), Math.sqrt(3e6 / (V.W * V.H)));
  V.fdpr = Math.min(V.gdpr, 1.25);
  const c = toS(IMG.pondCenter[0], IMG.pondCenter[1]);
  V.home = [clamp(c[0], V.W * 0.3, V.W * 0.75), clamp(c[1], V.H * 0.25, V.H * 0.7)];
}
const toS = (ix, iy) => [ix * V.s + V.ox, iy * V.s + V.oy];
const toI = (x, y) => [(x - V.ox) / V.s, (y - V.oy) / V.s];

/* ---------------- 水面蒙版：R = 可见水面，G = 涟漪可传播区域 ---------------- */
let maskData = null, maskW = 1, maskH = 1;
function maskAt(x, y, ch) {
  const xi = ((x - V.ox) / V.s * maskW / IMG.w) | 0, yi = ((y - V.oy) / V.s * maskH / IMG.h) | 0;
  if (xi < 0 || yi < 0 || xi >= maskW || yi >= maskH) return 0;
  return maskData[(yi * maskW + xi) * 4 + ch] / 255;
}
function domainAt(x, y, m) {        // 鱼可以去的地方：水域且不贴屏幕边
  return maskAt(x, y, 1) * smooth(0, m, x) * smooth(0, m, V.W - x) * smooth(0, m, y) * smooth(0, m, V.H - y);
}
function randomWaterPoint(margin, minVis = 0.9) {
  for (let i = 0; i < 300; i++) {
    const x = rand(margin, V.W - margin), y = rand(margin, V.H - margin);
    if (maskAt(x, y, 0) > minVis && maskAt(x, y, 1) > 0.95) return [x, y];
  }
  return V.home.slice();
}

/* ---------------- 涟漪：CPU 高度场波动方程（固定 60Hz） ---------------- */
const SIM = { cell: 4, cols: 0, rows: 0, cur: null, prev: null, dom: null, px: null, u8: null, acc: 0 };
function buildSim() {
  let cell = 4;
  while ((V.W / cell + 2) * (V.H / cell + 2) > 120000) cell += 0.5;
  SIM.cell = cell; SIM.cols = Math.ceil(V.W / cell) + 2; SIM.rows = Math.ceil(V.H / cell) + 2;
  const n = SIM.cols * SIM.rows;
  SIM.cur = new Float32Array(n); SIM.prev = new Float32Array(n); SIM.dom = new Float32Array(n);
  SIM.px = new Uint8ClampedArray(n * 4); SIM.u8 = new Uint8Array(SIM.px.buffer);
  for (let j = 0; j < SIM.rows; j++) for (let i = 0; i < SIM.cols; i++) {
    SIM.dom[j * SIM.cols + i] = lerp(0.55, 1, maskAt(i * cell, j * cell, 1));
  }
}
function simStep() {
  const { cols, rows, dom } = SIM, c = SIM.cur, p = SIM.prev, damp = CONFIG.rippleDecay;
  for (let y = 1; y < rows - 1; y++) {
    let i = y * cols + 1;
    for (let x = 1; x < cols - 1; x++, i++) {
      p[i] = ((c[i - 1] + c[i + 1] + c[i - cols] + c[i + cols]) * 0.5 - p[i]) * damp * dom[i];
    }
  }
  SIM.cur = p; SIM.prev = c;
}
function disturb(x, y, radius, amount) {
  const { cell, cols, rows } = SIM, c = SIM.cur;
  const r = Math.max(1.3, radius / cell), cx = x / cell, cy = y / cell;
  const x0 = Math.max(1, Math.floor(cx - r)), x1 = Math.min(cols - 2, Math.ceil(cx + r));
  const y0 = Math.max(1, Math.floor(cy - r)), y1 = Math.min(rows - 2, Math.ceil(cy + r));
  for (let j = y0; j <= y1; j++) for (let i = x0; i <= x1; i++) {
    const d = Math.hypot(i - cx, j - cy) / r;
    if (d < 1) { const k = j * cols + i; c[k] += amount * (0.5 + 0.5 * Math.cos(d * Math.PI)) * SIM.dom[k]; }
  }
}
function simAt(x, y) {
  const { cell, cols, rows } = SIM, c = SIM.cur;
  const i = clamp(Math.round(x / cell), 1, cols - 2), j = clamp(Math.round(y / cell), 1, rows - 2), k = j * cols + i;
  return { h: c[k], gx: (c[k + 1] - c[k - 1]) * 0.5, gy: (c[k + cols] - c[k - cols]) * 0.5 };
}
function encodeSim() {
  const { cols, rows } = SIM, c = SIM.cur, b = SIM.px;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const k = j * cols + i, h = c[k], o = k * 4;
    const l = i > 0 ? c[k - 1] : 0, r = i < cols - 1 ? c[k + 1] : 0;
    const u = j > 0 ? c[k - cols] : 0, d = j < rows - 1 ? c[k + cols] : 0;
    b[o] = 128 + h * 40;
    b[o + 1] = 128 + (r - l) * 30;
    b[o + 2] = 128 + (d - u) * 30;
    b[o + 3] = 128 + (l + r + u + d - 4 * h) * 40;
  }
}

/* ---------------- WebGL：水面合成（底图 + 焦散 + 投影 + 锦鲤 + 折射 + 高光） ---------------- */
const PREC = `#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
`;
const VS_WATER = `attribute vec2 a; uniform vec2 uSize; varying vec2 vP;
void main(){ vP = vec2(a.x * .5 + .5, .5 - a.y * .5) * uSize; gl_Position = vec4(a, 0., 1.); }`;
const FS_WATER = PREC + `
varying vec2 vP;
uniform vec2 uSize, uShadowTexel, uFishShTexel;
uniform vec4 uImg;
uniform vec3 uGrid;
uniform float uS, uTime, uCausT, uCaus, uBreath, uRefr;
uniform sampler2D uBg, uMask, uH, uFish, uShadow, uFishSh;

vec2 imgUV(vec2 p) { return (p - uImg.xy) / uImg.zw; }
vec2 hash2(vec2 p) {
  p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3)));
  return fract(sin(p) * 43758.5453);
}
// 动态 Voronoi 边线：f2 - f1 越小越靠近细胞边界 -> 焦散亮纹
float cellEdge(vec2 x, float t) {
  vec2 n = floor(x), f = fract(x);
  float d1 = 9., d2 = 9.;
  for (int j = -1; j <= 1; j++)
  for (int i = -1; i <= 1; i++) {
    vec2 g = vec2(float(i), float(j));
    vec2 o = 0.5 + 0.4 * sin(t + 6.2831 * hash2(n + g));
    vec2 r = g + o - f;
    float d = dot(r, r);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
  }
  return sqrt(d2) - sqrt(d1);
}
float caustic(vec2 p, float t) {
  vec2 w = p + 14. * vec2(sin(p.y * .017 + t * .9), cos(p.x * .015 - t * .7));
  float a = 1. - smoothstep(0., .11, cellEdge(w / 92., t));
  float b = 1. - smoothstep(0., .09, cellEdge(vec2(w.y, -w.x) / 63. + 7.3, t * 1.35 + 2.));
  return a * a * .55 + b * b * .35 + a * b * .9;
}
float blur5(sampler2D s, vec2 uv, vec2 d) {
  return texture2D(s, uv).a * .4 + (texture2D(s, uv + vec2(d.x, 0.)).a + texture2D(s, uv - vec2(d.x, 0.)).a
       + texture2D(s, uv + vec2(0., d.y)).a + texture2D(s, uv - vec2(0., d.y)).a) * .15;
}
void main() {
  vec2 p = vP;
  vec4 hs = texture2D(uH, (p / uGrid.x + .5) / uGrid.yz);
  vec2 g = (hs.gb * 255. - 128.) / 30.;
  float lap = (hs.a * 255. - 128.) / 40.;
  float t = uTime;
  // 极轻的整体水面起伏，让底图原有光纹也“活”起来
  vec2 amb = vec2(sin(p.y * .013 / uS + t * .7) + .6 * sin((p.x + p.y) * .009 / uS - t * .45),
                  cos(p.x * .011 / uS - t * .6) + .6 * cos((p.x - p.y) * .008 / uS + t * .5)) * .9 * uS;
  float m = texture2D(uMask, imgUV(p)).r;
  vec2 off = -g * 6.5 * uRefr * uS + amb;
  vec2 q = p + off * m;
  q = mix(p, q, texture2D(uMask, imgUV(q)).r);
  vec3 dry = texture2D(uBg, imgUV(p)).rgb;
  vec3 col = texture2D(uBg, imgUV(q)).rgb;

  vec2 sp = q / uSize;
  float sh = blur5(uShadow, sp, uShadowTexel);
  float fs = blur5(uFishSh, sp, uFishShTexel);
  col *= 1. - sh * vec3(.46, .32, .3);
  col *= 1. - fs * vec3(.66, .44, .38);               // 鱼影：和底图里原有的鱼影一样偏深青色
  sh = 1. - (1. - sh) * (1. - fs);

  float c = caustic(q / uS, uCausT) * uCaus;
  col += c * vec3(.19, .23, .2) * (1. - sh * .7);
  col *= 1. + clamp(-lap * .09, -.16, .26);

  vec4 f = texture2D(uFish, (p + off * .75 * m) / uSize);
  col = col * (1. - f.a) + f.rgb * (1. + c * .35);

  col *= 1. + uBreath * (.6 * sin(t * .33) + .4 * sin(t * .21 + p.x * .0021 + p.y * .0017));

  vec3 n = normalize(vec3(-g * 1.3, 1.));
  vec3 L = normalize(vec3(-.45, -.55, 1.));
  vec3 hv = normalize(L + vec3(0., 0., 1.));
  float sl = (dot(n, L) - L.z) * .65;
  col += sl > 0. ? sl : max(sl * .55, -.12);         // 背光一侧只轻微压暗，避免新砸出的水坑像个黑洞
  col += pow(max(dot(n, hv), 0.), 240.) * .6;

  gl_FragColor = vec4(mix(dry, col, m), 1.);
}`;

/* ---------------- WebGL：锦鲤网格（身体 / 胸鳍 / 腹鳍 / 尾鳍，按身体坐标着色） ---------------- */
const VS_FISH = `attribute vec2 aPos; attribute vec4 aUV;
uniform vec2 uSize, uOffset;
varying vec4 vUV;
void main() { vUV = aUV; vec2 p = (aPos + uOffset) / uSize * 2. - 1.; gl_Position = vec4(p, 0., 1.); }`;
const FS_FISH = PREC + `
varying vec4 vUV;
uniform sampler2D uAtlas;
uniform vec4 uCell;
uniform vec3 uFin, uWater;
uniform float uPart, uDepth, uRoll, uMouth, uTime, uGold, uShowa, uAlpha, uFeather, uShadow, uSeed, uBias;

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

void main() {
  float a; vec3 col;
  if (uPart < .5) {
    // ---- 身体：x = 沿身体 t (0 头 → 1 尾柄)，y = 横向 v (-1..1)，zw = 以体长为单位的物理坐标 ----
    float t = vUV.x, v = vUV.y, A = vUV.z, B = vUV.w, av = abs(v);
    a = 1. - smoothstep(1. - uFeather * .5, 1. + uFeather * .5, av);
    if (uShadow > .5) { a *= uAlpha; gl_FragColor = vec4(0., 0., 0., a); return; }
    v = clamp(v, -1., 1.); av = abs(v);
    col = texture2D(uAtlas, uCell.xy + vec2(clamp(t, 0., 1.), v * .5 + .5) * uCell.zw, uBias).rgb;
    float vr = v - uRoll * .45;                       // 侧倾：背脊高光偏向一侧
    // 鳞片：沿身体走向排列的细弧线；金鲤更亮，并有逐片闪烁
    vec2 sc = vec2(A * 31., B * 31.);
    float row = floor(sc.x);
    sc.y += mod(row, 2.) * .5;

/* ---------------- 指针 ---------------- */
const ptr = { x: 0, y: 0, vx: 0, vy: 0, speed: 0, active: false, t: 0, lastMove: -99, down: null, travel: 0, lastDrop: -9 };
let nowS = 0;

/* ---------------- 鱼的行为 ---------------- */
let fishes = [];
function pickTarget(f, awayFrom) {
  const L = f.L;
  for (let i = 0; i < 40; i++) {
    let a = f.a + rand(-1.7, 1.7);
    if (awayFrom) a = Math.atan2(f.y - awayFrom[1], f.x - awayFrom[0]) + rand(-0.8, 0.8);
    const d = rand(1.4, 4) * L, x = f.x + Math.cos(a) * d, y = f.y + Math.sin(a) * d;
    if (maskAt(x, y, 0) > 0.85 && domainAt(x, y, 0.6 * L) > 0.9) { f.target = [x, y]; f.targetT = rand(6, 12); return; }
  }

}
function tailTip(f) { const i = (NS - 1) * 2; return [f.dp[i] - Math.cos(f.ang[NS - 1]) * 0.2 * f.L, f.dp[i + 1] - Math.sin(f.ang[NS - 1]) * 0.2 * f.L]; }

  f.v += 0.6 * f.L * k;
  f.phase += 0.8;

  if (k >= 0.9) {
    const [tx, ty] = tailTip(f);
    disturb(tx, ty, 15 * V.s, -1.8 * RS());                  // 尾巴拍水
    disturb(f.x, f.y, 8 * V.s, 0.9 * RS());
    for (const o of fishes) {
      if (o === f || o.fear > 0.3) continue;
      if (Math.hypot(o.x - f.x, o.y - f.y) < 1.8 * f.L) o.pending = { t: rand(0.06, 0.25), a: Math.atan2(o.y - f.y, o.x - f.x), k: 0.5 };
    }

}
function nearestFood(f) {
  const [mx, my] = f.mouthPos; let best = null, bd = Infinity;
  for (const p of food) {
    if (!p.landed || p.eaten) continue;
    const d = Math.hypot(p.x - mx, p.y - my);
    if (d > 5 * f.L * CONFIG.fishSensitivity) continue;
    if (p.age - p.delay < f.reaction + d / (3.2 * f.L) * 0.5) continue;   // 远处的鱼稍晚才发现
    if (d < bd) { bd = d; best = p; }

}
function rankByPointer() {
  if (!ptr.active) return;
  fishes.map((f) => [f, Math.hypot(f.x - ptr.x, f.y - ptr.y)]).sort((a, b) => a[1] - b[1]).forEach(([f], i) => { f.rank = i; });
}
function isCurious(f) {
  if (!ptr.active || nowS - ptr.lastMove > 6 || f.fear > 0.05 || f.rank > 2) return false;
  if (ptr.speed > 380 * CONFIG.fishSensitivity) return false;
  const [mx, my] = f.mouthPos;

function updateFish(f, dt) {

  if (f.pending && (f.pending.t -= dt) <= 0) { startle(f, f.pending.a, f.pending.k); f.pending = null; }
  const mid = (NS >> 1) * 2, mx = f.sp[mid], my = f.sp[mid + 1];
  // 缓慢变化的深度：隔一阵子换一个目标深度
  if ((f.depthT -= dt) <= 0) { f.depthGoal = rand(CONFIG.fishDepth[0], CONFIG.fishDepth[1]); f.depthT = rand(CONFIG.depthChange[0], CONFIG.depthChange[1]); }

}

const food = [];

  disturb(x, y, 24 * V.s, -3 * RS());
  disturb(x, y, 9 * V.s, 1.4 * RS());
  for (let i = 0; i < CONFIG.foodPerClick; i++) {
    const a = rand(0, TAU), r = Math.sqrt(Math.random()) * 30 * V.s;
    food.push({ x: x + Math.cos(a) * r, y: y + Math.sin(a) * r, age: 0, delay: rand(0.08, 0.45), landed: false, eaten: false, sink: 0 });
  }

}

  for (let i = food.length - 1; i >= 0; i--) {
    const p = food[i];
    p.age += dt;
    if (!p.landed && p.age >= p.delay) { p.landed = true; disturb(p.x, p.y, 5 * V.s, -0.6 * RS()); }
    if (p.landed) {

function drawFood(ctx) {
  for (const p of food) {
    if (!p.landed) continue;
    const r = 2.7 * V.s * (1 - 0.4 * p.sink), a = (1 - smooth(0.6, 1, p.sink)) * (1 - 0.5 * p.sink);
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fillStyle = `rgba(146,78,32,${a})`; ctx.fill();
    ctx.beginPath(); ctx.arc(p.x - r * 0.3, p.y - r * 0.3, r * 0.45, 0, TAU); ctx.fillStyle = `rgba(232,170,100,${a * 0.9})`; ctx.fill();
  }
}

  disturb(x, y, 8 * V.s, (big ? 0.8 : 0.3) * RS());

    const ix = IMG.pivot[0] + Math.cos(a) * d, iy = IMG.pivot[1] + Math.sin(a) * d, [x, y] = toS(ix, iy);

    const kT = 80, cT = 2 * 0.45 * Math.sqrt(kT), tgx = clamp(Gx * 13 * CONFIG.padTilt * K.tilt * dz, -0.6, 0.6), tgy = clamp(Gy * 13 * CONFIG.padTilt * K.tilt * dz, -0.6, 0.6);

function drawFloater(ctx, f, shadow) {

/* ---------------- 待机生命感 ---------------- */
let nextDrop = 1.5, nextGulp = 6;
function idleLife(dt) {

    const [x, y] = randomWaterPoint(30, 0.95); disturb(x, y, 7 * V.s, -1.1 * RS());
  }
  if ((nextGulp -= dt) <= 0) {
    nextGulp = rand(7, 14);
    const f = fishes[(Math.random() * fishes.length) | 0];
    if (f && f.mode === 'cruise' && f.depth < 0.4) { const [x, y] = f.mouthPos; disturb(x, y, 6 * V.s, -0.6 * RS()); f.mouth = 1; }
  }
}

/* ---------------- 指针事件（鼠标 + 触摸） ---------------- */
// 指针：沿路径按单位长度注入一条连续的尾迹（快慢都不出珠链纹），
// 再每隔 ~70ms 在指针处“点”一下，形成一圈圈向外扩散的涟漪
function trail(x0, y0, x1, y1, t) {
  const len = Math.hypot(x1 - x0, y1 - y0); if (len < 0.5) return;
  const n = Math.min(120, Math.ceil(len / (SIM.cell * 0.6)));
  const amp = -0.12 * (len / n) * RS(), rad = 8 * V.s;
  for (let i = 1; i <= n; i++) disturb(lerp(x0, x1, i / n), lerp(y0, y1, i / n), rad, amp);
  ptr.travel += len;
  if (t - ptr.lastDrop > 0.07 && ptr.travel > 2) { disturb(x1, y1, 11 * V.s, -1.3 * RS()); ptr.lastDrop = t; ptr.travel = 0; }
}
function bindPointer() {
  hero.addEventListener('pointermove', (e) => {
    const t = e.timeStamp / 1000, x = e.clientX, y = e.clientY;
    if (ptr.active) {
      const dt = Math.max(0.004, t - ptr.t);
      ptr.vx = lerp(ptr.vx, (x - ptr.x) / dt, 0.45); ptr.vy = lerp(ptr.vy, (y - ptr.y) / dt, 0.45);
      ptr.speed = Math.hypot(ptr.vx, ptr.vy);
      trail(ptr.x, ptr.y, x, y, t);
    } else {
      ptr.vx = ptr.vy = ptr.speed = 0;

    }
    ptr.x = x; ptr.y = y; ptr.t = t; ptr.lastMove = t; ptr.active = true;
    if (ptr.down && Math.hypot(x - ptr.down.x, y - ptr.down.y) > 12) ptr.down.moved = true;
  }, { passive: true });
  hero.addEventListener('pointerdown', (e) => {
    const x = e.clientX, y = e.clientY;
    ptr.x = x; ptr.y = y; ptr.t = ptr.lastMove = e.timeStamp / 1000; ptr.active = true; ptr.vx = ptr.vy = ptr.speed = 0;
    if (e.pointerType === 'mouse') { if (e.button === 0) feed(x, y); }
    else { ptr.down = { x, y, t: ptr.t, moved: false }; disturb(x, y, 12 * V.s, -1.2 * RS()); }
  });

    if (e.pointerType === 'mouse') return;
    const d = ptr.down; ptr.down = null; ptr.active = false;
    if (d && !d.moved && e.timeStamp / 1000 - d.t < 0.45) feed(e.clientX, e.clientY);   // 轻触 = 投食

// Keyboard access is opt-in with embed=1 and uses the same water / feed physics.
function bindEmbedKeyboard() {
  if (!embedded) return;
  const point = () => {
    if (!keyboardPoint) {
      keyboardPoint = maskAt(V.home[0], V.home[1], 1) >= 0.5 ? V.home.slice() : randomWaterPoint(30);
    }
    return keyboardPoint;
  };
  hero.addEventListener('keydown', (e) => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const direction = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
    if (!direction && e.key !== ' ' && e.key !== 'Enter') return;
    e.preventDefault();
    const [x0, y0] = point(), t = performance.now() / 1000;
    if (direction) {
      const step = Math.max(12, Math.min(V.W, V.H) * 0.035);
      const x = clamp(x0 + direction[0] * step, 12, V.W - 12);
      const y = clamp(y0 + direction[1] * step, 12, V.H - 12);
      if (maskAt(x, y, 1) >= 0.5) {
        trail(x0, y0, x, y, t);
        keyboardPoint = [x, y];
        ptr.vx = direction[0] * 140; ptr.vy = direction[1] * 140; ptr.speed = 140;
      }
    } else if (!e.repeat) feed(x0, y0);
    ptr.x = point()[0]; ptr.y = point()[1]; ptr.t = ptr.lastMove = t; ptr.active = true;

}
function drawKeyboardPoint(ctx) {
  if (!embedded || !keyboardPoint || document.activeElement !== hero || !hero.matches(':focus-visible')) return;
  ctx.save();
  ctx.beginPath(); ctx.arc(keyboardPoint[0], keyboardPoint[1], 10, 0, TAU);
  ctx.strokeStyle = 'rgba(13,43,48,.75)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 1.5; ctx.stroke();

}
function notifyEmbedReady() {
  if (!embedded || parent === window || !document.referrer) return;

    if (parentOrigin !== 'null') parent.postMessage({ type: 'koi-pond:ready', version: 1 }, parentOrigin);
  } catch (_) { /* A missing or opaque parent does not affect the pond. */ }

/* ---------------- 尺寸 ---------------- */
function resize() {
  if (!hero.clientWidth || !hero.clientHeight) return;        // 被隐藏 / 尺寸为 0 时保持原布局
  const old = { s: V.s, ox: V.ox, oy: V.oy };
  layout();
  keyboardPoint = null;
  cvW.width = Math.round(V.W * V.gdpr); cvW.height = Math.round(V.H * V.gdpr);
  cvS.width = Math.round(V.W * V.dpr); cvS.height = Math.round(V.H * V.dpr);
  cvH.width = Math.ceil(V.W / SHADOW_DOWN); cvH.height = Math.ceil(V.H / SHADOW_DOWN);
  buildSim(); allocGL();
  for (const f of fishes) {                         // 保持鱼在原图上的相对位置
    const ix = (f.x - old.ox) / old.s, iy = (f.y - old.oy) / old.s, [x, y] = toS(ix, iy);
    f.place(clamp(x, 0, V.W), clamp(y, 0, V.H), f.a); f.target = null;
  }

/* ---------------- 主循环 ---------------- */
let raf = 0, last = 0, T = 0, dead = false;
const SPR = {};
function frame(ms) {

  const sdt = dt * (reduced ? CONFIG.reducedMotionSpeed : 1);
  T += sdt;

  if (now - ptr.lastMove > 0.05) { const k = Math.exp(-dt * 10); ptr.vx *= k; ptr.vy *= k; ptr.speed *= k; }
  SIM.acc += dt;
  let n = 0;
  while (SIM.acc >= 1 / 60 && n < 3) { simStep(); SIM.acc -= 1 / 60; n++; }
  if (n === 3) SIM.acc = 0;

  if (!reduced) idleLife(sdt);
  rankByPointer();
  for (const f of fishes) updateFish(f, sdt);
  updateFood(sdt); rodPhysics(sdt); updateAngler(sdt); updateFloaters(sdt);

  hctx.setTransform(1, 0, 0, 1, 0, 0); hctx.clearRect(0, 0, cvH.width, cvH.height);
  hctx.setTransform(1 / SHADOW_DOWN, 0, 0, 1 / SHADOW_DOWN, 0, 0);
  for (const f of floaters) drawFloater(hctx, f, true);
  hctx.setTransform(1, 0, 0, 1, 0, 0);
  drawAnglerShadows(hctx);

  drawFishGL();          // 锦鲤与鱼影（GPU 网格）
  renderWater();         // 水面合成

  // 水面层：鱼食、漂浮物、浮漂、鱼线、人物（袖子 / 斗笠 / 钓竿 / 双手）
  sctx.setTransform(1, 0, 0, 1, 0, 0); sctx.clearRect(0, 0, cvS.width, cvS.height);
  sctx.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  drawFood(sctx);
  if (embedded) drawKeyboardPoint(sctx);
  sctx.setTransform(V.dpr * V.s, 0, 0, V.dpr * V.s, V.dpr * V.ox, V.dpr * V.oy);

});
const onMotion = (e) => { reduced = e.matches; if (!reduced && AN.state === 'wait' && AN.dur === Infinity) AN.dur = AN.t + rand(2, 5); };
if (motionMQ.addEventListener) motionMQ.addEventListener('change', onMotion); else if (motionMQ.addListener) motionMQ.addListener(onMotion);

/* ---------------- 启动 ---------------- */
const load = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });

  const A = window.KOI_ASSETS;

  layout();

    await Promise.all([A.pond, A.patch, A.mask, A.leaf, A.pad, A.rod, A.figplate, A.hat, A.arms, A.hands, A.floats].map(load));
  Object.assign(SPR, { leaf, pad, rod, hat, arms, hands,
    leafLit: tintSprite(leaf, 1.35, 18), leafDark: tintSprite(leaf, 0.62, 0), padLit: tintSprite(pad, 1.3, 22), padDark: tintSprite(pad, 0.6, 0) });
  SPR.floats = IMG.floats.map(([k, , , w, h, , ax, ay]) => {        // 从贴图集切出每片原有的叶子
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    c.getContext('2d').drawImage(floats, ax, ay, w, h, 0, 0, w, h);
    return k === 'l' ? { img: c, lit: tintSprite(c, 1.35, 18), dark: tintSprite(c, 0.62, 0) } : { img: c, lit: tintSprite(c, 1.3, 22), dark: tintSprite(c, 0.6, 0) };
  });
  // 页面在隐藏或尺寸为 0 的容器里打开时，等它有了尺寸再摆放鱼和浮漂（否则缩放为 0，坐标全变成 NaN）
  await new Promise((res) => {
    if (hero.clientWidth && hero.clientHeight) return res();
    const ro = new ResizeObserver(() => { if (hero.clientWidth && hero.clientHeight) { ro.disconnect(); res(); } });
    ro.observe(hero);

  const mctx = mc.getContext('2d'); mctx.drawImage(mask, 0, 0); maskData = mctx.getImageData(0, 0, maskW, maskH).data;
  const bg = document.createElement('canvas'); bg.width = IMG.w; bg.height = IMG.h;
  const bctx = bg.getContext('2d'); bctx.drawImage(pond, 0, 0); bctx.drawImage(patch, IMG.patchAt[0], IMG.patchAt[1]);
  bctx.drawImage(figplate, IMG.fig.plate[0], IMG.fig.plate[1]);                 // 人物的可动部件改由水面层绘制
  const count = Math.min(KINDS.length, (hero.clientWidth < 700 ? CONFIG.fishCountNarrow : CONFIG.fishCount));
  const made = [];
  for (let i = 0; i < count; i++) { const f = new Koi(KINDS[i % KINDS.length], i); paintPattern(f, i); made.push(f); }
  if (!initGL(bg, mask)) { cvW.style.display = cvS.style.display = 'none'; console.warn('WebGL 不可用：保留静态底图'); return; }
  buildIndices(KINDS.length);
  resize();
  for (const f of made) {
    let p = randomWaterPoint(0.8 * f.L);
    for (let k = 0; k < 30 && fishes.some((o) => Math.hypot(o.x - p[0], o.y - p[1]) < f.L); k++) p = randomWaterPoint(0.8 * f.L);
    f.place(p[0], p[1], rand(0, TAU)); pickTarget(f);
    fishes.push(f);
  }

  rodPose(); ROD.e = ROD.eT = 0.07; AN.firstWait = reduced ? Infinity : rand(CONFIG.firstReel[0], CONFIG.firstReel[1]);
  setState('wait'); FL.slack = 0.38; FL.slackSide = 1; AN.quickRest = true;     // 第一次收竿后只歇 1 秒就抛
  bindPointer();

})();

<!-- 内嵌素材（base64）：pond = 去掉 5 条静止锦鲤、原有枫叶 / 荷叶 / 荷花及其影子后的底图；patch = 再去掉钓竿 / 鱼线 / 浮漂 / 竿影的补丁（动态重画）；
     mask = 水面蒙版；leaf / pad = 取自底图的漂浮物；rod = 拉直的竹竿贴图（从握把尾端到竿梢，分段贴到弯曲的竿身上）；
     figplate = 去掉斗笠 / 袖子 / 双手 / 握把后补齐的人物底板；hat / arms / hands = 从底图切出的人物可动部件；
     floats = 底图原有的枫叶 / 荷叶 / 荷花的贴图集（底图里已移除，改为原位动态） -->
